<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>Super Panel Gemini</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="sidebar">
        <h2>Panel AI</h2>
        <button class="nav-btn" data-target="story">Story Gen</button>
        <button class="nav-btn" data-target="ecom">E-commerce</button>
    </nav>
    </div>

    <main id="main-content">
        <section id="story" class="content-box">
            <h3>Story Generator</h3>
            <textarea id="input-story" placeholder="Topik cerita..."></textarea>
            <button id="btn-story">Generate</button>
        </section>

        <section id="ecom" class="content-box hidden">
            <h3>E-commerce Tool</h3>
            <input type="text" id="url-ecom" placeholder="URL Produk...">
            <button id="btn-ecom">Analisis</button>
        </section>
    </main>

    <script type="module" src="main.js"></script>
</body>

</html>
